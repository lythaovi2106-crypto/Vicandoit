<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ Từ Vựng</title>
<meta name="theme-color" content="#0e161e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ Từ Vựng">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,500;7..72,700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a night-study desk. Ink-slate sidebar + one focused work column; leaf green for "remembered", coral for the word itself, amber for coins. */
:root{
  --bg:#0e161e;
  --surface:#152029;
  --surface-2:#1c2a35;
  --line:#2a3b48;
  --text:#e9eff3;
  --muted:#93a5b3;
  --accent:#58cc02;
  --accent-2:#89e219;
  --accent-ink:#0a1a00;
  --accent-soft:rgba(88,204,2,.14);
  --word:#ff7a6b;
  --coin:#ffc53d;
  --danger:#ff5d5d;
  --warn:#ffb020;
  --info:#4cc3ff;
  --ok:#3fd17a;
  --font-ui:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-word:"Literata", Georgia, "Times New Roman", serif;
  --font-ipa:"Noto Sans", "Segoe UI", "Lucida Sans Unicode", "Arial Unicode MS", sans-serif;
  --r:14px;
  --r-sm:10px;
  color-scheme:dark;
}
body[data-accent="ocean"]{--accent:#38bdf8;--accent-2:#7dd3fc;--accent-ink:#00131f;--accent-soft:rgba(56,189,248,.14)}
body[data-accent="sunset"]{--accent:#ff8a3d;--accent-2:#ffb27a;--accent-ink:#2a1000;--accent-soft:rgba(255,138,61,.15)}
body[data-accent="grape"]{--accent:#b07cff;--accent-2:#cfaeff;--accent-ink:#17052f;--accent-soft:rgba(176,124,255,.16)}
body[data-accent="sakura"]{--accent:#ff6fae;--accent-2:#ffa3cb;--accent-ink:#2a0015;--accent-soft:rgba(255,111,174,.15)}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
a{color:var(--accent-2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);padding:4px 8px}
.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-word);font-weight:700;font-size:18px}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.01em}
.nav-links{display:flex;flex-direction:column;gap:2px}
.nav-links a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:600}
.nav-links a:hover{background:var(--surface-2);color:var(--text)}
.nav-links a.active{background:var(--accent-soft);color:var(--text)}
.nav-links a.active .ni{color:var(--accent)}
.ni{width:20px;text-align:center;font-size:17px}
.badge{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--word);color:#2b0700;font-size:12px;font-weight:800;text-align:center}
.badge.soft{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
.wallet{display:flex;gap:8px}
.wallet span{flex:1;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface-2);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.coins{color:var(--coin)}
.sync{font-size:12px;color:var(--muted)}
.sync.ok::before{content:"● ";color:var(--ok)}
.sync.local::before{content:"● ";color:var(--warn)}
main{padding:28px clamp(16px,4vw,44px) 60px;min-width:0;outline:none}
.page{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page.narrow{max-width:760px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.page-head p{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.tight{padding:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;cursor:pointer;text-decoration:none;color:var(--text);white-space:nowrap;transition:transform .08s ease, background .15s}
.btn:hover{background:#243541}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.big{padding:14px 22px;font-size:16px;border-radius:14px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:15px}
.icon-btn:hover{background:#243541}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600;cursor:pointer;color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.new{background:rgba(76,195,255,.15);color:var(--info)}
.pill.learn{background:rgba(255,176,32,.15);color:var(--warn)}
.pill.young{background:var(--accent-soft);color:var(--accent-2)}
.pill.mature{background:rgba(63,209,122,.18);color:var(--ok)}
.pill.leech{background:rgba(255,93,93,.15);color:var(--danger)}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0f1a22;color:var(--text);font-size:15px}
textarea{resize:vertical;min-height:110px;line-height:1.5}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
.progress{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .4s ease}
.kbd{display:inline-block;padding:0 6px;border-radius:6px;border:1px solid var(--line);border-bottom-width:2px;font-size:11px;font-weight:700;color:var(--muted);font-family:var(--font-ui)}
.empty{padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.notice{padding:12px 14px;border-radius:12px;background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.35);color:#ffd99a;font-size:14px}
.notice.info{background:rgba(76,195,255,.08);border-color:rgba(76,195,255,.3);color:#bfe8ff}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{padding:8px 14px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}
.tab.on{background:var(--surface-2);color:var(--text)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.today{display:flex;flex-direction:column;gap:16px;background:linear-gradient(160deg,var(--surface-2),var(--surface));}
.today-nums{display:flex;gap:26px;flex-wrap:wrap}
.today-nums div{display:flex;flex-direction:column}
.today-nums b{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.today-nums span{color:var(--muted);font-size:13px;font-weight:600}
.n-due b{color:var(--word)}
.n-new b{color:var(--info)}
.n-learn b{color:var(--warn)}
.ring-wrap{display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;flex:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.kpi b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}
.word-chips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:inline-flex;gap:8px;align-items:baseline;padding:7px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.wchip b{font-family:var(--font-word);font-weight:700}
.wchip span{font-size:12.5px;color:var(--muted)}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .tip-n{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent-2);font-weight:800}

/* ---------- full word card (back side) ---------- */
.wcard{display:flex;flex-direction:column;gap:18px}
.wc-head{display:flex;gap:18px;align-items:center}
.wc-pic{flex:none;width:112px;height:112px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;font-size:58px;overflow:hidden;border:1px solid var(--line)}
.wc-pic img{width:100%;height:100%;object-fit:cover}
.headword{font-family:var(--font-word);font-size:clamp(34px,5vw,52px);font-weight:700;color:var(--word);letter-spacing:-.01em;line-height:1.05;word-break:break-word}
.meta-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.pos{font-weight:700;color:var(--muted);font-size:14px}
.cefr{font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.ipa{font-family:var(--font-ipa);font-size:17px;color:var(--text)}
.ipa small{font-family:var(--font-ui);color:var(--muted);font-size:11px;font-weight:700;margin-right:4px}
.say{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:13px;color:var(--text);vertical-align:middle}
.say:hover{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.vi-mean{font-size:20px;font-weight:700;line-height:1.4}
.example{padding:14px 16px;border-left:4px solid var(--word);background:var(--surface-2);border-radius:0 12px 12px 0;display:flex;flex-direction:column;gap:6px}
.example .en{font-family:var(--font-word);font-size:18px}
.example .vi{color:var(--muted);font-size:14px}
mark.hl{background:none;color:var(--word);font-weight:700}
mark.syn{background:none;color:var(--accent-2);font-weight:700}
.wc-sec{display:flex;flex-direction:column;gap:8px}
.wc-sec h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.syn-chips{display:flex;gap:6px;flex-wrap:wrap}
.syn-chips span{padding:3px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent-2);font-weight:700}
ul.clean{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px}
ul.clean li{padding-left:14px;position:relative}
ul.clean li::before{content:"";position:absolute;left:0;top:.7em;width:6px;height:6px;border-radius:2px;background:var(--line)}
.coll-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}
.coll-grid div{display:flex;flex-direction:column;padding:6px 0;border-bottom:1px dashed var(--line)}
.coll-grid .en{font-weight:600}
.coll-grid .vi{font-size:13px;color:var(--muted)}
.fam li b{color:var(--accent-2)}
.gram{display:flex;flex-direction:column;gap:10px}
.gram > div{padding:10px 12px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.gram .p{font-weight:800}
.gram .v{color:var(--muted);font-size:14px}
.gram .e{font-family:var(--font-word);margin-top:2px}
.gram-html{font-size:14px;line-height:1.6}
.gram-html ul{margin:4px 0;padding-left:20px}
.mnemo{padding:12px 14px;border-radius:12px;background:rgba(255,197,61,.08);border:1px dashed rgba(255,197,61,.4);color:#ffe3a1}
.mnemo b{color:var(--coin)}

/* ---------- study ---------- */
.study-top{display:flex;align-items:center;gap:14px}
.study-top .progress{flex:1}
.counts{display:flex;gap:10px;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.counts .c-new{color:var(--info)}
.counts .c-learn{color:var(--warn)}
.counts .c-due{color:var(--word)}
.flash{min-height:380px;display:flex;flex-direction:column;gap:16px}
.front{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:12px 0}
.front .big:not(.btn){font-family:var(--font-word);font-size:clamp(40px,7vw,66px);font-weight:700;color:var(--word);line-height:1.05;word-break:break-word}
.front .prompt{font-size:22px;font-weight:700}
.front .emoji{font-size:56px;line-height:1}
.front .pic{max-height:190px;max-width:100%;border-radius:14px}
.hintbox{width:100%;padding:12px 14px;border-radius:12px;background:var(--surface-2);text-align:left;display:flex;flex-direction:column;gap:6px}
.hintbox .lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.guess{font-family:var(--font-ipa);font-size:28px;font-weight:600;letter-spacing:.12em;color:var(--accent-2)}
.cloze{font-family:var(--font-word);font-size:19px;line-height:1.6}
.cloze .blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--word);margin:0 4px}
.type-in{width:min(460px,100%);font-size:26px!important;text-align:center;padding:12px 14px!important;border-width:2px!important;font-family:var(--font-word)!important}
.type-in.good{border-color:var(--ok)!important;background:rgba(63,209,122,.12)!important}
.type-in.bad{border-color:var(--danger)!important;background:rgba(255,93,93,.1)!important}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.choice{padding:14px 16px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface-2);font-weight:700;font-size:16px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center;color:var(--text)}
.choice:hover{border-color:var(--accent)}
.choice .k{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.choice.right{border-color:var(--ok);background:rgba(63,209,122,.15)}
.choice.wrong{border-color:var(--danger);background:rgba(255,93,93,.12)}
.choice.en{font-family:var(--font-word);font-size:18px}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;position:sticky;bottom:0;padding:10px 0;background:var(--surface);z-index:2}
@media (max-width:760px){.rate{bottom:70px}}
.rate button{padding:12px 6px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;color:var(--text)}
.rate button small{font-weight:600;color:var(--muted);font-size:12px}
.rate .r1{border-color:rgba(255,93,93,.6)}
.rate .r2{border-color:rgba(255,176,32,.6)}
.rate .r3{border-color:rgba(88,204,2,.7)}
.rate .r4{border-color:rgba(76,195,255,.6)}
.rate button.sugg{background:var(--accent-soft);outline:2px solid var(--accent);outline-offset:1px}
.verdict{padding:12px 16px;border-radius:12px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.verdict.ok{background:rgba(63,209,122,.13);color:#9df0bf}
.verdict.no{background:rgba(255,93,93,.12);color:#ffb3b3}
.verdict .ans{font-family:var(--font-word);font-size:20px;color:var(--text)}
.keys{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:12.5px}
.done-card{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center;padding:36px 20px}
.done-card .big-n{font-size:56px;font-weight:800;color:var(--accent)}

/* ---------- games ---------- */
.ready{display:flex;flex-direction:column;gap:10px}
.ready .row b{font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);border-bottom-width:4px;cursor:pointer;text-align:left;color:var(--text);transition:transform .1s, border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.tile:disabled{opacity:.5;cursor:not-allowed;transform:none}
.tile .t-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:24px;margin-bottom:6px}
.tile h3{font-size:17px;font-weight:800}
.tile p{color:var(--muted);font-size:13.5px}
.tile .reward{margin-top:auto;padding-top:8px;color:var(--coin);font-weight:800}
.tile .hot{position:absolute;top:14px;right:14px;padding:3px 9px;border-radius:99px;background:var(--word);color:#2b0700;font-size:11px;font-weight:800}
.tile.special{background:linear-gradient(150deg,#2a1a12,var(--surface) 60%);border-color:#5a3626}
.game-shell{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.g-top{display:flex;gap:12px;align-items:center}
.g-top .progress{flex:1}
.g-score{font-weight:800;font-variant-numeric:tabular-nums;color:var(--coin)}
.g-q{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.g-q .q-lbl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mt{padding:14px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface-2);cursor:pointer;font-weight:700;min-height:58px;color:var(--text);text-align:center;transition:opacity .3s, transform .2s}
.mt.en{font-family:var(--font-word);font-size:18px}
.mt.sel{border-color:var(--info);background:rgba(76,195,255,.12)}
.mt.right{border-color:var(--ok);background:rgba(63,209,122,.15);opacity:.25;pointer-events:none}
.mt.wrong{border-color:var(--danger);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fc-wrap{perspective:1200px;width:100%}
.fc{position:relative;width:100%;min-height:300px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--surface-2)}
.canvas-wrap{width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line);position:relative;touch-action:manipulation}
.canvas-wrap canvas{display:block;width:100%}
.flappy-hud{position:absolute;left:0;right:0;top:0;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;pointer-events:none;background:linear-gradient(rgba(8,16,24,.75),rgba(8,16,24,0))}
.flappy-hud .q{font-weight:800;font-size:17px}
.flappy-hud .lives{font-size:18px;white-space:nowrap}
.monkey-word{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-family:var(--font-ipa);font-size:30px;font-weight:700}
.monkey-word span{min-width:30px;border-bottom:3px solid var(--line);text-align:center}
.monkey-word span.sp{border:0;min-width:16px}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:620px}
.kb button{width:42px;height:46px;border-radius:10px;border:1px solid var(--line);border-bottom-width:3px;background:var(--surface-2);font-weight:800;cursor:pointer;color:var(--text);text-transform:uppercase}
.kb button.hit{background:rgba(63,209,122,.2);border-color:var(--ok)}
.kb button.miss{background:rgba(255,93,93,.15);border-color:var(--danger);opacity:.6}
.scene{width:100%;max-width:520px;height:auto;border-radius:18px;background:#0f2430}
.mic{width:86px;height:86px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:34px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.mic.on{background:var(--word);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(255,122,107,.15)}}
.heard{min-height:28px;font-family:var(--font-word);font-size:20px}

/* ---------- library ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:200px}
.toolbar select{width:auto}
.wlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.wrow{display:grid;grid-template-columns:44px minmax(0,1.2fr) minmax(0,1.6fr) 110px 120px;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.wrow:last-child{border-bottom:0}
.wrow:hover{background:var(--surface-2)}
.wrow .em{font-size:24px;text-align:center}
.wrow .em img{width:36px;height:36px;border-radius:8px;object-fit:cover}
.wrow .w b{font-family:var(--font-word);font-size:18px}
.wrow .w .ipa{font-size:13px;color:var(--muted);display:block}
.wrow .m{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .due{font-size:12.5px;color:var(--muted);text-align:right}
.rbar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.rbar i{display:block;height:100%;background:var(--accent)}

/* ---------- add ---------- */
.gen-list{display:flex;flex-direction:column;gap:8px}
.gen-item{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.gen-item .st{margin-left:auto;font-size:13px;font-weight:700}
.gen-item .st.ok{color:var(--ok)}
.gen-item .st.err{color:var(--danger)}
.gen-item .st.run{color:var(--info)}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.inbox-item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.inbox-item .ctx{font-size:13px;color:var(--muted)}
.edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.edit-grid .full{grid-column:1/-1}
.edit-grid textarea{min-height:80px;font-size:14px}

/* ---------- stats ---------- */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--surface-2)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 55%,var(--surface-2))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--accent) 80%,var(--surface-2))}
.heat i[data-l="4"]{background:var(--accent-2)}
.dist{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.dist i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
svg text{fill:var(--muted);font-family:var(--font-ui)}

/* ---------- prefs / shop ---------- */
.pref{display:grid;grid-template-columns:1fr minmax(180px,260px);gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pref:last-child{border-bottom:0}
.pref .t{font-weight:700}
.pref .d{font-size:13px;color:var(--muted)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.shop-item{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.swatch{height:34px;border-radius:9px}

/* ---------- modal, toast ---------- */
.modal-back{position:fixed;inset:0;background:rgba(4,9,13,.72);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:50;overflow-y:auto}
.modal{width:min(820px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal.sm{width:min(460px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-head h3{font-size:18px}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{padding:11px 16px;border-radius:12px;background:#22323e;border:1px solid var(--line);font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:360px;animation:tin .25s ease}
.toast.ok{border-color:rgba(63,209,122,.5)}
.toast.err{border-color:rgba(255,93,93,.6)}
.toast.coin{border-color:rgba(255,197,61,.6);color:var(--coin)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
.ai-answer{white-space:pre-wrap;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14.5px}

/* ---------- research-based card parts ---------- */
.def-en{font-family:var(--font-word);font-size:16.5px;color:#c9d6df}
.core{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:12px;background:rgba(76,195,255,.08);border:1px solid rgba(76,195,255,.3)}
.core b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--info)}
.senses{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.senses li::marker{color:var(--info);font-weight:800}
.s-ex{font-family:var(--font-word);font-size:16px;margin-top:2px}
.syll{font-family:var(--font-ipa);font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;padding:2px 8px;border-radius:6px;border:1px dashed var(--line)}
.chip-s{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip-s.type{color:var(--info);border-color:rgba(76,195,255,.4)}
.diff{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:rgba(255,176,32,.16);color:var(--warn);vertical-align:2px;cursor:help}
.coll-group{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.coll-group .pat{font-size:12px;font-weight:800;color:var(--accent-2);letter-spacing:.03em}
.mist{display:flex;flex-direction:column;gap:8px}
.mist > div{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;padding:10px 12px;border-radius:10px;background:rgba(255,93,93,.06);border:1px solid rgba(255,93,93,.25)}
.m-wrong{color:#ff9d9d;text-decoration:line-through;text-decoration-color:rgba(255,93,93,.6)}
.m-right{color:#9df0bf;font-weight:600}
.m-why{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.syn-chips span.ant{background:rgba(255,93,93,.1);color:#ffb3b3}
.rel-chips{display:flex;flex-wrap:wrap;gap:6px}
.rel-chips span{padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-size:13.5px}
.formulas{display:flex;flex-direction:column;gap:6px}
.formula{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.formula .lbl{font-size:12px;font-weight:800;color:var(--muted);min-width:84px}
.formula code{font-family:var(--font-ipa);font-size:16px;font-weight:600;color:var(--accent-2)}
.ex-list{display:flex;flex-direction:column;gap:8px}
.headword.long{font-size:clamp(26px,3.6vw,38px)}
.front .big.long:not(.btn){font-size:clamp(26px,4.5vw,40px)}
.encode-tip{padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13.5px;color:var(--text)}
.copy-type{align-items:center;text-align:center}
.my-sent{padding:12px;border-radius:12px;background:rgba(255,197,61,.07);border:1px dashed rgba(255,197,61,.35);color:#f3e6c4}
.pill.enc{background:rgba(176,124,255,.15);color:#cfaeff}
.memo-fold summary{cursor:pointer;list-style:none}
.memo-fold summary::-webkit-details-marker{display:none}
.memo-fold[open] summary{margin-bottom:8px}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13.5px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.flow{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;counter-reset:f}
.flow li{counter-increment:f;display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:12px;background:var(--surface-2);font-size:13.5px}
.flow li b::before{content:counter(f) ". ";color:var(--accent)}
.flow li span{color:var(--muted)}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.m-grid p{font-size:14.5px}
.method h3{font-size:17px;line-height:1.35;padding-top:3px}

/* ---------- grammar small cards ---------- */
.gq{font-family:var(--font-word);font-size:clamp(20px,3vw,26px);line-height:1.45;text-align:center;font-weight:600}
.gq .blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--word);margin:0 4px}
.wcard .gq{text-align:left}
.g-ans{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:rgba(63,209,122,.1);border:1px solid rgba(63,209,122,.35)}
.g-ans .lbl{font-size:12px;font-weight:800;color:var(--ok);text-transform:uppercase;letter-spacing:.06em}
.g-ans b{font-family:var(--font-word);font-size:19px}
details.card > summary{list-style:none}
details.card > summary::-webkit-details-marker{display:none}
/* ---------- mind map ---------- */
.mm-overlay{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column}
.mm-bar{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.mm-title{display:flex;flex-direction:column;min-width:0}
.mm-title b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.mm-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mm-edit{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 14px;background:var(--accent-soft);border-bottom:1px solid var(--accent)}
.mm-hint{padding:6px 14px;color:var(--muted);background:var(--surface)}
.mm-svg{flex:1;width:100%;touch-action:none;cursor:grab;display:block}
.mm-svg:active{cursor:grabbing}
.mm-node{cursor:pointer}
.mm-node.ref rect{filter:drop-shadow(0 0 0 transparent)}
.mm-node:hover rect{filter:brightness(1.12)}
.mm-node.hid text{fill:var(--muted)!important}
.mm-tg{cursor:pointer}
/* ---------- decks & folders ---------- */
.btn-folder{background:#1b9fe0;border-color:transparent;color:#00111c;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn-folder:hover{filter:brightness(1.08);background:#1b9fe0}
.deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.dcard{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:border-color .15s, transform .1s}
.dcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.dcard.folder{background:linear-gradient(160deg,#16303f,var(--surface) 70%);border-color:#22506a}
.dc-top{display:flex;gap:12px;align-items:flex-start}
.dc-ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:22px}
.dc-t{flex:1;min-width:0}
.dc-t b{display:block;font-size:16.5px;font-weight:800;line-height:1.3;word-break:break-word}
.dc-t p{font-size:13px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dc-meta{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--muted);font-weight:600}
.due-n{color:var(--word)}
.progress.thin{height:7px}
.dc-actions{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.dc-actions .btn{margin-right:auto}
.crumbs{font-size:13.5px;color:var(--muted);margin-bottom:6px}
.crumbs a{color:var(--muted)}
.deck-hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dh-ic{width:68px;height:68px;border-radius:18px;background:var(--surface-2);display:grid;place-items:center;font-size:36px;flex:none}
.deck-hero h1{font-size:26px;font-weight:800}
.kpi-icons .kpi{display:flex;gap:14px;align-items:center}
.kpi-icons .ki{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px}
.kpi-icons .kpi div span{display:block}
.kpi-icons .kpi .ki{display:grid;font-size:19px}
.mini-decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mini-deck{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer;color:var(--text);text-align:left}
.mini-deck:hover{border-color:var(--accent)}
.mini-deck .md-t{flex:1;min-width:0;display:flex;flex-direction:column}
.mini-deck .badge{margin:0}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent)}
.wlist.selecting .wrow{grid-template-columns:24px 44px minmax(0,1.2fr) minmax(0,1.6fr) 110px 120px}
.deck-tag{display:block;font-size:11.5px;color:var(--muted);opacity:.8}
.cs-opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.cs-opt input[type=radio]{margin-top:4px;accent-color:var(--accent)}
.memo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.memo{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:12px;background:rgba(255,197,61,.07);border:1px dashed rgba(255,197,61,.35)}
.memo b{font-size:12.5px;color:var(--coin)}
.memo span{font-size:14.5px;color:#f3e6c4}
.img-pick{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.img-prev{width:200px;height:200px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:90px;overflow:hidden;flex:none}
.img-prev img{width:100%;height:100%;object-fit:cover}
.paste-zone{padding:14px;border-radius:12px;border:2px dashed var(--line);font-size:13.5px;color:var(--muted)}
.paste-zone.over,.paste-zone:focus{border-color:var(--accent);color:var(--text)}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:1fr 1fr}
  .wrow{grid-template-columns:40px minmax(0,1fr) 96px}
  .wrow .m,.wrow .due{display:none}
  .wlist.selecting .wrow{grid-template-columns:24px 40px minmax(0,1fr) 96px}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40;border-right:0;border-top:1px solid var(--line)}
  .brand,.side-foot{display:none}
  .nav-links{flex-direction:row;flex:1;justify-content:space-around}
  .nav-links a{flex-direction:column;gap:2px;padding:6px 4px;font-size:10.5px;position:relative}
  .nav-links a[data-nav="stats"],.nav-links a[data-nav="library"]{display:none}
  .badge{position:absolute;top:0;right:2px;margin:0;font-size:10px;padding:0 5px;min-width:16px}
  main{padding:18px 16px 96px}
  .grid2,.grid3,.edit-grid{grid-template-columns:1fr}
  .coll-grid,.memo-grid,.m-grid,.mist > div{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr}
  .nav-links a[data-nav="method"],.nav-links a[data-nav="prefs"]{display:none}
  .mm-bar{flex-direction:column;align-items:stretch}
  .mm-tools .btn.sm{padding:5px 8px;font-size:12px}
  .wlist.selecting .wrow{grid-template-columns:24px 40px minmax(0,1fr) 96px}
  .img-prev{width:140px;height:140px}
  .choices{grid-template-columns:1fr}
  .rate{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pref{grid-template-columns:1fr}
  .wc-pic{width:80px;height:80px;font-size:42px}
  .mobile-wallet{display:flex!important}
  #toasts{left:16px;right:16px;bottom:84px}
}
.mobile-wallet{display:none;gap:8px}
.mobile-wallet span{padding:6px 10px;border-radius:10px;background:var(--surface-2);font-weight:800;font-size:13px}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ---------- Hackers TOEIC 30 ngày ---------- */
.lbl-s{display:none}
.hk-home{display:flex;gap:16px;align-items:center;text-decoration:none;color:var(--text);border-color:var(--accent-soft)}
.hk-home:hover{border-color:var(--accent)}
.hk-home .hk-daybig{width:72px;height:72px;font-size:11px}.hk-home .hk-daybig b{font-size:28px}
.hk .page-head{align-items:flex-start}
.hk-search{position:relative;width:min(320px,100%)}
.hk-res{position:absolute;right:0;left:0;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.45);max-height:380px;overflow:auto;padding:6px}
.hk-hit{display:grid;grid-template-columns:auto auto 1fr;gap:4px 8px;align-items:baseline;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:10px;background:none;color:var(--text);cursor:pointer}
.hk-hit:hover{background:var(--surface-2)}
.hk-hit b{font-family:var(--font-word)}
.hk-hit .v{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hk-hit .d{grid-column:1/-1;font-size:11.5px;color:var(--accent-2);font-weight:700}
.hk-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center}
.hk-kpis{display:grid;gap:10px}
.hk-kpis > div{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.hk-kpis b{font-size:22px;min-width:52px}
.hk-kpis span{flex:1;color:var(--muted);font-size:13.5px}
.hk-part{display:flex;flex-direction:column;gap:12px}
.hk-part h2{font-size:19px;margin:0}
.hk-road{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;position:relative}
.hk-road::before{content:"";position:absolute;top:30px;bottom:30px;left:50%;width:4px;margin-left:-2px;background:repeating-linear-gradient(var(--line) 0 10px,transparent 10px 18px);border-radius:4px}
.hk-node{position:relative;display:flex;align-items:center;gap:14px;transform:translateX(var(--x));background:none;border:0;color:var(--text);cursor:pointer;padding:0;width:300px;justify-content:center}
.hk-dot{flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .12s}
.hk-num{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-weight:800;font-size:20px;border:2px solid var(--line)}
.hk-node:hover .hk-dot{transform:translateY(-2px)}
.hk-node.done .hk-num{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.hk-node.cur .hk-dot{animation:hkpulse 1.8s infinite}
@keyframes hkpulse{0%{box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 0 0 var(--accent-soft)}70%{box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 0 16px transparent}100%{box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 0 0 transparent}}
.hk-node.locked{opacity:.5}
.hk-lbl{display:flex;flex-direction:column;text-align:left;width:150px;line-height:1.25}
.hk-lbl span{font-size:12.5px;color:var(--muted)}
.hk-lbl .hk-st{color:var(--coin);font-weight:700}
.hk-node:nth-child(even){flex-direction:row-reverse}
.hk-node:nth-child(even) .hk-lbl{text-align:right}
.hk-ck{display:flex;gap:14px;align-items:center;justify-content:center;padding:14px 18px;border-radius:16px;border:2px dashed var(--line);background:var(--surface);color:var(--text);cursor:pointer;text-align:left;align-self:center;min-width:min(420px,100%)}
.hk-ck .hk-ck-ic{font-size:30px}
.hk-ck span{display:flex;flex-direction:column}
.hk-ck.done{border-style:solid;border-color:var(--coin)}
.hk-ck.locked{opacity:.55}
.hk-stars{color:var(--coin);letter-spacing:2px;font-weight:800}
.hk-stars i{font-style:normal;color:var(--line)}
.hk-stars.big{font-size:34px}
.hk-dayhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hk-daybig{display:flex;flex-direction:column;align-items:center;justify-content:center;width:92px;height:92px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;letter-spacing:.12em;flex:none}
.hk-daybig b{font-size:38px;letter-spacing:0;line-height:1}
.hk-step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:start}
.hk-step-n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line);font-weight:800}
.hk-step.done .hk-step-n{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.hk-lv{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.hk-table{display:flex;flex-direction:column;max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.hk-row{display:grid;grid-template-columns:minmax(140px,1.1fr) 44px minmax(0,1.6fr) 56px;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.hk-row .w{display:flex;gap:6px;align-items:center}
.hk-row .w b{font-family:var(--font-word);font-size:16px}
.hk-row .pos{justify-self:start}
.hk-row .v{font-size:14px}
.hk-sec{position:sticky;top:0;background:var(--surface);padding:8px 12px;font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-2);border-bottom:1px solid var(--line);z-index:1}
.hk-big{font-family:var(--font-word);font-size:40px;font-weight:700;color:var(--word);line-height:1.15;word-break:break-word}
.hk-cloze{font-family:var(--font-word);font-size:21px;line-height:1.5;max-width:620px}
.hk-cloze .blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--accent);color:var(--accent);font-weight:700}
.hk-fb{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.hk-fb b{font-family:var(--font-word);font-size:22px;color:var(--word)}
@media (max-width:760px){
  .hk-hero{grid-template-columns:1fr}
  .lbl-l{display:none}.lbl-s{display:inline}
  .nav-links a{padding:6px 2px}
  .nav-links a span{white-space:nowrap}
  .hk-home{flex-wrap:wrap}.hk-home > .btn{width:100%}
  .hk-node{width:260px}
  .hk-lbl{width:130px}
  .hk-row{grid-template-columns:minmax(0,1fr) 48px;grid-template-areas:"w a" "v v"}
  .hk-row .w{grid-area:w}.hk-row .v{grid-area:v}.hk-row .pos{display:none}.hk-row > span:last-child{grid-area:a}
  .hk-daybig{width:64px;height:64px;font-size:11px}.hk-daybig b{font-size:26px}
  .hk-dayhead{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px}
  .hk-dayhead h1{font-size:22px}
  .hk-dayact{grid-column:1/-1;grid-row:1;justify-content:space-between}
  .hk-step{grid-template-columns:1fr}.hk-step-n{display:none}
}

</style>

const Speech = {
  voices: [],
  init() {
    if (!('speechSynthesis' in window)) return;
    const load = () => { try { this.voices = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang)); } catch { this.voices = []; } };
    load(); try { speechSynthesis.addEventListener('voiceschanged', load); } catch { }
  },
  voice() {
    const st = S.profile.settings, vs = this.voices; if (!vs.length) return null;
    return vs.find(v => v.name === st.voiceName) || vs.find(v => (st.accent === 'us' ? /en[-_]US/i : /en[-_]GB/i).test(v.lang)) || vs[0];
  },
  engine() {
    const st = S.profile.settings.voice;
    if (st === 'claude' && S.caps.tts) return 'claude';
    if (st === 'browser' && this.voices.length) return 'browser';
    if (this.voices.length) return 'browser';
    if (S.caps.tts) return 'claude';
    return null;
  },
  async speak(text, rate) {
    text = String(text || '').trim(); if (!text) return;
    rate = rate || S.profile.settings.rate;

    }

/* ================= card rendering (research-based layout: form → meaning → use → memory) ================= */
function picHtml(w, cls = '') {
  if (w.image) return `<img class="${cls}" src="${esc(w.image)}" alt="${esc(w.word)}">`;

}
function ipaLine(w) {

  if (w.ipa_us && w.ipa_us !== w.ipa) parts.push(`<span class="ipa"><small>US</small>${esc(w.ipa_us)}</span>`);
  if (w.syll) parts.push(`<span class="syll" title="Âm tiết, chữ IN HOA là trọng âm">${esc(w.syll)}</span>`);
  return parts.join(' ') + ' ' + sayBtn(w.word, 'Nghe phát âm') + ` <button type="button" class="say" data-say="${esc(w.word)}" data-rate="0.6" title="Nghe chậm" aria-label="Nghe chậm">🐢</button>`;
}
function sec(title, body, cls = '') { return body ? `<section class="wc-sec ${cls}"><h4>${title}</h4>${body}</section>` : ''; }
function mistakesHtml(w) {

}
function collocHtml(w) {

  const keys = Object.keys(groups);
  const item = c => `<div><span class="en">${hl(c.en, [w.word])}${c.diff ? ` <span class="diff" title="${esc(c.note || 'Dịch từng chữ từ tiếng Việt sẽ sai')}">≠ TV</span>` : ''}</span><span class="vi">${esc(c.vi)}${c.diff && c.note ? ` · <i>${esc(c.note)}</i>` : ''}</span></div>`;
  const body = keys.length > 1 || keys[0]
    ? keys.map(k => `<div class="coll-group">${k ? `<div class="pat">${esc(k)}</div>` : ''}<div class="coll-grid">${groups[k].map(item).join('')}</div></div>`).join('')
    : `<div class="coll-grid">${cs.map(item).join('')}</div>`;
  const nDiff = cs.filter(c => c.diff).length;
  return sec('Collocations · cụm từ đi kèm', (nDiff ? `<p class="small muted">Cụm có nhãn <span class="diff">≠ TV</span> là cụm mà dịch từng chữ từ tiếng Việt sẽ sai, cần học kỹ nhất.</p>` : '') + body);
}
function memoryHtml(w, open = true) {
  const m = w.memory || {};
  const items = [['🔊 Âm giống', m.sound || w.mnemonic], ['🎬 Hình dung', m.story], ['🧩 Gốc từ', m.roots], ['⚠️ Dễ nhầm', m.confuse], ['✍️ Câu của tôi', w.mysentence], ['💡 Ghi chú của tôi', w.note]].filter(x => x[1]);

  return open ? sec('Mẹo ghi nhớ', grid) : `<details class="wc-sec memo-fold"><summary><h4 style="display:inline">Mẹo ghi nhớ</h4> <span class="small muted">(bấm để mở)</span></summary>${grid}</details>`;
}
function headHtml(w) {
  const chips = [w.cefr && `<span class="cefr">${esc(w.cefr)}</span>`, w.freq && `<span class="chip-s">${esc(w.freq)}</span>`, w.register && `<span class="chip-s">${esc(w.register)}</span>`, typeOf(w) !== 'word' && `<span class="chip-s type">${ITEM_TYPES[typeOf(w)]}</span>`].filter(Boolean).join('');
  return `<div class="wc-head">
      <div class="wc-pic">${picHtml(w)}</div>
      <div style="min-width:0">
        <h2 class="headword ${typeOf(w) !== 'word' ? 'long' : ''}">${esc(w.word)}</h2>
        <div class="meta-row">${w.pos ? `<span class="pos">${esc(w.pos)}</span>` : ''}${chips}</div>

function renderFull(w, { compact = false, memoOpen = true } = {}) {
  const t = typeOf(w);
  if (t === 'grammar') return renderGrammar(w, { compact, memoOpen });
  if (t === 'gcard') return renderGCard(w, { memoOpen });
  if (t === 'phrase') return renderPhrase(w, { compact, memoOpen });
  const terms = [w.word];
  const fam = (w.family || []).map(f => `<li><b>${esc(f.w)}</b> <span class="muted">(${esc(f.pos)})</span> ${esc(f.vi)}${f.example ? `<div class="small" style="font-family:var(--font-word)">${hl(f.example, [f.w])}</div>` : ''}</li>`).join('');
  const syns = w.synonyms || [];
  const synS = (w.synonym_sentences || []).map(s => `<li>${hl(s, syns, 'syn')}</li>`).join('');
  const gram = (w.grammar || []).map(g => `<div><div class="p">${esc(g.pattern)}</div><div class="v">${esc(g.vi)}</div>${g.example ? `<div class="e">${hl(g.example, terms)} ${sayBtn(g.example)}</div>` : ''}</div>`).join('');
  const senses = (w.senses || []);
  const multi = senses.length > 1;
  return `<article class="wcard">
    ${headHtml(w)}
    <div class="stack" style="gap:6px">
      ${w.vi ? `<p class="vi-mean">${esc(w.vi)}</p>` : ''}
      ${w.def_en ? `<p class="def-en">${hl(w.def_en, terms)}</p>` : ''}
    </div>
    ${multi && w.core ? `<div class="core"><b>Nghĩa cốt lõi</b><span>${esc(w.core)}</span></div>` : ''}
    ${multi ? sec(`${senses.length} nghĩa của từ`, `<ol class="senses">${senses.map(x => `<li><b>${esc(x.vi)}</b>${x.def_en ? ` <span class="muted small">${esc(x.def_en)}</span>` : ''}${x.example ? `<div class="s-ex">${hl(x.example, terms)} ${sayBtn(x.example)}</div>` : ''}${x.example_vi ? `<div class="small muted">${esc(x.example_vi)}</div>` : ''}</li>`).join('')}</ol>`) : ''}
    ${w.example ? `<div class="example"><div class="en">${hl(w.example, terms)} ${sayBtn(w.example, 'Nghe câu')}</div>${w.example_vi ? `<div class="vi">${esc(w.example_vi)}</div>` : ''}</div>` : ''}
    ${memoryHtml(w, memoOpen)}
    ${compact ? '' : `
    ${collocHtml(w)}
    ${mistakesHtml(w)}
    ${gram ? sec('Cách dùng & ngữ pháp', `<div class="gram">${gram}</div>`) : ''}
    ${w.grammarHtml ? sec('Ghi chú ngữ pháp', `<div class="gram-html">${sanitizeHtml(w.grammarHtml)}</div>`) : ''}
    ${(syns.length || synS) ? sec('Từ đồng nghĩa' + ((w.antonyms || []).length ? ' · trái nghĩa' : ''), `<div class="syn-chips">${syns.map(s => `<span>${esc(s)}</span>`).join('')}${(w.antonyms || []).map(s => `<span class="ant">≠ ${esc(s)}</span>`).join('')}</div>${synS ? `<ul class="clean">${synS}</ul>` : ''}`) : ''}
    ${fam ? sec('Họ từ (word family)', `<ul class="clean fam">${fam}</ul>`) : ''}
    ${(w.related || []).length ? sec('Cùng chủ đề hay đi cùng', `<div class="rel-chips">${w.related.map(r => `<span>${esc(r)}</span>`).join('')}</div>`) : ''}
    ${(w.suggest || []).length ? sec('Gợi ý liên tưởng', `<ul class="clean">${w.suggest.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`) : ''}
    ${w.context ? sec('Ngữ cảnh bạn gặp', `<p class="muted">${hl(w.context, terms)}</p>`) : ''}`}

function renderPhrase(w, { compact = false, memoOpen = true } = {}) {
  const terms = [w.word.replace(/\s*\+.*$/, '').replace(/\.\.\.|…/g, '').trim()].filter(Boolean);
  const ex = [{ en: w.example, vi: w.example_vi }, ...(w.examples || [])].filter(x => x.en);
  return `<article class="wcard">
    ${headHtml(w)}
    <div class="stack" style="gap:6px">${w.vi ? `<p class="vi-mean">${esc(w.vi)}</p>` : ''}${w.def_en ? `<p class="def-en">${esc(w.def_en)}</p>` : ''}</div>

    ${w.structure ? `<div class="formula"><span class="lbl">Cấu trúc</span><code>${esc(w.structure)}</code></div>` : ''}
    ${ex.length ? sec('Ví dụ trong nhiều tình huống', `<div class="ex-list">${ex.map(x => `<div class="example"><div class="en">${hl(x.en, terms)} ${sayBtn(x.en)}</div>${x.vi ? `<div class="vi">${esc(x.vi)}</div>` : ''}</div>`).join('')}</div>`) : ''}
    ${memoryHtml(w, memoOpen)}
    ${compact ? '' : `
    ${mistakesHtml(w)}
    ${(w.variations || []).length ? sec('Biến thể', `<div class="syn-chips">${w.variations.map(s => `<span>${esc(s)}</span>`).join('')}</div>`) : ''}
    ${(w.synonyms || []).length ? sec('Cách nói tương tự', `<div class="syn-chips">${w.synonyms.map(s => `<span>${esc(s)}</span>`).join('')}</div>`) : ''}

}
function renderGrammar(w, { compact = false, memoOpen = true } = {}) {

    ${w.vi ? `<p class="vi-mean">${esc(w.vi)}</p>` : ''}

    ${(w.uses || []).length ? sec('Dùng khi nào', `<ol class="senses">${w.uses.map(u => `<li><b>${esc(u.when)}</b>${u.example ? `<div class="s-ex">${esc(u.example)} ${sayBtn(u.example)}</div>` : ''}${u.example_vi ? `<div class="small muted">${esc(u.example_vi)}</div>` : ''}</li>`).join('')}</ol>`) : ''}
    ${(w.signals || []).length ? sec('Dấu hiệu nhận biết', `<div class="syn-chips">${w.signals.map(s => `<span>${esc(s)}</span>`).join('')}</div>`) : ''}

    ${mistakesHtml(w)}
    ${(w.exercises || []).length ? `<p class="small muted">Có ${w.exercises.length} bài luyện cho cấu trúc này, sẽ xuất hiện xen kẽ khi ôn tập.</p>` : ''}

      <label class="field full">Câu chứa từ đồng nghĩa (mỗi dòng 1 câu)<textarea id="f-synS">${esc(lines(w.synonym_sentences))}</textarea></label>
      <label class="field full">Collocations (mỗi dòng: cụm từ (nghĩa))<textarea id="f-coll">${esc((w.collocations || []).map(c => c.en + (c.vi ? ' (' + c.vi + ')' : '')).join('\n'))}</textarea></label>
      <label class="field full">Họ từ (mỗi dòng: từ (loại) nghĩa)<textarea id="f-fam">${esc((w.family || []).map(f => `${f.w} (${f.pos}) ${f.vi}`).join('\n'))}</textarea></label>
      <label class="field full">Cách dùng (mỗi dòng: mẫu | giải thích | ví dụ)<textarea id="f-gram">${esc((w.grammar || []).map(g => [g.pattern, g.vi, g.example].join(' | ')).join('\n'))}</textarea></label>
      <label class="field full">Ngữ cảnh bạn gặp từ<input type="text" id="f-context" value="${esc(w.context)}"></label>

    </form>`);

    const word = v('f-word'); if (!word) return;
    if (isNew && findByWord(word, v('f-deck'))) { toast('Từ này đã có trong bộ.', 'err'); return; }
    Object.assign(w, {
      word, vi: v('f-vi'), pos: v('f-pos'), cefr: v('f-cefr').toUpperCase(), ipa: v('f-ipa'), ipa_us: v('f-ipa_us'), emoji: v('f-emoji'), deck: v('f-deck'),
      example: v('f-example'), example_vi: v('f-example_vi'), suggest: v('f-suggest').split('\n').map(s => s.trim()).filter(Boolean),
      synonyms: v('f-syn').split('=').map(s => s.trim()).filter(Boolean), mnemonic: v('f-mnemonic'), memory: { ...(w.memory || {}), sound: v('f-mnemonic') },
      synonym_sentences: v('f-synS').split('\n').map(s => s.trim()).filter(Boolean),
      collocations: v('f-coll').split('\n').map(s => s.trim()).filter(Boolean).map(parseColl),
      family: v('f-fam').split('\n').map(s => s.trim()).filter(Boolean).map(parseFam),
      grammar: v('f-gram').split('\n').map(s => s.trim()).filter(Boolean).map(s => { const [p, vi, ex] = s.split('|').map(x => (x || '').trim()); return { pattern: p, vi: vi || '', example: ex || '' }; }),
      context: v('f-context')
    });
    persistWord(w); if (isNew) addLog('a', 1);
    closeModal(); toast(isNew ? 'Đã thêm "' + word + '".' : 'Đã lưu thay đổi.', 'ok'); rerenderSoft();
    if (!isNew) setTimeout(() => openWord(w.id), 50);
  });
}

function ring(pct, label) {

}

function parseInputList(text, splitCommas = true) {
  let lines = String(text || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (splitCommas && lines.length === 1 && !lines[0].includes('|') && lines[0].includes(',')) lines = lines[0].split(',').map(s => s.trim()).filter(Boolean);
  const seen = new Set(); const out = [];
  for (let l of lines) {
    l = l.replace(/^(\d+[\.\)]|[-•*])\s*/, '').replace(/^\(|\)$/g, '');
    const [w, ...ctx] = l.split('|'); const word = w.trim().replace(/[.;:!?]+$/, '');
    if (!word || seen.has(norm(word))) continue; seen.add(norm(word));
    out.push({ word, context: ctx.join('|').trim() });
  }
  return out;
}

async function generateList(items, deck, listEl, onDone, type = 'word') {
  const bs = type === 'grammar' ? 1 : type === 'phrase' ? 2 : 3;
  S.busy = true;
  const rows = items.map(it => ({ ...it, key: rid('g') }));
  const dup = rows.filter(r => findByWord(r.word, deck));
  const todo = rows.filter(r => !findByWord(r.word, deck));
  listEl.insertAdjacentHTML('afterbegin', rows.map(r => `<div class="gen-item" id="${r.key}"><b style="font-family:var(--font-word);font-size:17px">${esc(r.word)}</b>${r.context ? `<span class="small muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch">${esc(r.context)}</span>` : ''}<span class="st">${dup.includes(r) ? 'Đã có trong bộ' : 'Đang chờ'}</span></div>`).join(''));
  const setSt = (r, cls, html) => { const el = $('#' + r.key); if (el) { const s = el.querySelector('.st'); s.className = 'st ' + cls; s.innerHTML = html; } };
  let made = 0;
  const run = async batch => {
    batch.forEach(r => setSt(r, 'run', '<span class="spin"></span> AI đang soạn…'));
    try {
      const data = await aiGenerate(batch, type);
      batch.forEach((r, i) => {
        const o = data[i] || data.find(x => norm(x.input || x.word) === norm(r.word));
        if (!o || !o.word) { setSt(r, 'err', 'Lỗi dữ liệu'); r.failed = true; return; }
        if (findByWord(o.word, deck)) { setSt(r, '', 'Đã có trong bộ'); return; }
        const w = makeWord({ ...o, context: r.context }, deck); w.created = now() + made;
        persistWord(w); made++; addLog('a', 1);
        setSt(r, 'ok', `✓ <button class="btn sm" data-open="${w.id}">Xem thẻ</button>`);
      });
    } catch (e) {
      if (e && (e.code === 'not_granted' || e.code === 'rate_limited' || e.code === 'not_available')) { batch.forEach(r => { setSt(r, 'err', 'Chưa tạo được'); r.failed = true; }); return 'stop'; }
      if (batch.length > 1) { for (const r of batch) { const st = await run([r]); if (st === 'stop') return 'stop'; } }
      else { setSt(batch[0], 'err', 'Lỗi, thử lại sau'); batch[0].failed = true; }
    }
  };
  for (let i = 0; i < todo.length; i += bs) { const st = await run(todo.slice(i, i + bs)); if (st === 'stop') { todo.slice(i + bs).forEach(r => { setSt(r, 'err', 'Chưa tạo'); r.failed = true; }); break; } }
  S.busy = false;
  const failed = todo.filter(r => r.failed);
  if (failed.length) {
    failed.forEach(r => S.profile.inbox.push({ id: rid('i'), word: r.word, context: r.context, type, t: now() })); saveProfile();
    toast(failed.length + ' từ chưa tạo được đã được đưa vào hộp chờ.', 'err');
  }
  if (made) { toast('Đã tạo ' + made + ' thẻ mới.', 'ok'); refreshBadges(); }
  if (onDone) onDone(made);
}

function unq(f) { f = String(f ?? ''); if (/^".*"$/s.test(f)) f = f.slice(1, -1).replace(/""/g, '"'); return f; }

    return { full: ws.filter(o => o && o.word), bare: [], backup: Array.isArray(d) ? null : d };
  }
  const full = [], bare = [];
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim() || line.startsWith('#')) continue;
    const f = line.split('\t').map(unq);
    if (f.length < 3) { parseInputList(line).forEach(x => bare.push(x)); continue; }
    const [word, suggest, ipa, pos, phrase, syn, synS, coll, vi, fam, gram] = f;
    const T = s => stripTags(s || '');

      synonyms: T(syn).split('=').map(s => s.trim()).filter(Boolean), synonym_sentences: T(synS).split('/').map(s => s.trim()).filter(Boolean),
      collocations: T(coll).split(/\s\/\s|\/(?=\s*[A-Za-z])/).map(s => s.trim()).filter(Boolean).map(parseColl), vi: T(vi),
      family: T(fam).split('/').map(s => s.trim()).filter(Boolean).map(parseFam), grammarHtml: gram ? sanitizeHtml(gram) : ''
    });
  }

}
function grammarToHtml(w) {

}
function toTSV(words) {
  return words.map(w => [w.word, (w.suggest || []).join(' / '), w.ipa, w.pos, w.example, (w.synonyms || []).join(' = '), (w.synonym_sentences || []).join(' / '),

}

function viewStats(main) {
  const all = wordsInDeck('all'); const c = counts(all); const t0 = startOfDay();
  const days = S.log.days; const dk = k => days[k] || {};
  let r30 = 0, c30 = 0, act30 = 0, add30 = 0;
  for (let i = 0; i < 30; i++) { const k = dayKey(t0 - i * DAY); const d = dk(k); r30 += d.r || 0; c30 += d.c || 0; add30 += d.a || 0; if ((d.r || 0) + (d.g || 0) > 0) act30++; }
  const weeks = 20; const start = new Date(t0); start.setDate(start.getDate() - (weeks * 7 - 1) - ((start.getDay() + 6) % 7 === 6 ? 0 : 0));
  const firstDay = t0 - (weeks * 7 - 1) * DAY; const offset = (new Date(firstDay).getDay() + 6) % 7;
  let cells = ''; for (let i = 0; i < offset; i++) cells += '<i style="visibility:hidden"></i>';
  for (let i = 0; i < weeks * 7; i++) { const t = firstDay + i * DAY; const k = dayKey(t); const n = (dk(k).r || 0) + (dk(k).g || 0); const l = n === 0 ? 0 : n < 10 ? 1 : n < 25 ? 2 : n < 50 ? 3 : 4; cells += `<i data-l="${l}" title="${new Date(t).toLocaleDateString('vi-VN')}: ${n} lượt"></i>`; }
  const fc = Array.from({ length: 14 }, (_, i) => 0);
  for (const w of all) { const s = w.srs; if (!s || s.state !== 2) continue; const i = Math.max(0, Math.floor((startOfDay(s.due) - t0) / DAY)); if (i < 14) fc[i]++; }
  const max = Math.max(4, ...fc); const bw = 34, gap = 8, H = 150;
  const bars = fc.map((v, i) => { const h = Math.round(v / max * (H - 30)); const x = i * (bw + gap); return `<rect x="${x}" y="${H - 20 - h}" width="${bw}" height="${Math.max(h, 2)}" rx="6" fill="${i === 0 ? 'var(--word)' : 'var(--accent)'}" opacity="${i === 0 ? 1 : .85}"><title>${v} thẻ</title></rect>${v ? `<text x="${x + bw / 2}" y="${H - 26 - h}" text-anchor="middle" font-size="11">${v}</text>` : ''}<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle" font-size="11">${i === 0 ? 'Nay' : new Date(t0 + i * DAY).getDate()}</text>`; }).join('');
  const tot = Math.max(1, all.length);
  const dist = [['Mới', c.nw, 'var(--info)'], ['Đang học', c.learn, 'var(--warn)'], ['Đang nhớ', c.young, 'var(--accent-2)'], ['Đã thuộc', c.mature, 'var(--ok)']];
  const hard = all.filter(w => (w.srs?.lapses || 0) > 0).sort((a, b) => (b.srs.lapses - a.srs.lapses) || (b.srs.d - a.srs.d)).slice(0, 8);
  const cefr = {}; all.forEach(w => { const k = (w.cefr || '?').toUpperCase(); cefr[k] = (cefr[k] || 0) + 1; });
  main.innerHTML = `<div class="page">
    <div class="page-head"><div><h1>Thống kê</h1><p>Tiến bộ của bạn qua từng ngày.</p></div></div>
    <div class="kpis">
      <div class="kpi"><b>🔥 ${currentStreak()}</b><span>ngày liên tiếp · ${act30}/30 ngày có học</span></div>
      <div class="kpi"><b>${r30 ? Math.round(c30 / r30 * 100) : 0}%</b><span>tỉ lệ nhớ khi ôn (30 ngày)</span></div>
      <div class="kpi"><b>${r30}</b><span>lượt ôn 30 ngày</span></div>
      <div class="kpi"><b>${add30}</b><span>từ mới thêm 30 ngày</span></div>
    </div>
    <section class="card stack"><div class="row between"><h3>Lịch học 20 tuần</h3><span class="small muted">Mỗi ô là một ngày, càng đậm càng học nhiều</span></div><div class="heat">${cells}</div></section>
    <div class="grid2">
      <section class="card stack"><h3>Lịch ôn 14 ngày tới</h3><div style="overflow-x:auto"><svg viewBox="0 0 ${14 * (bw + gap)} ${H}" width="100%" style="min-width:420px" role="img" aria-label="Số thẻ đến hạn mỗi ngày">${bars}</svg></div></section>
      <section class="card stack"><h3>Mức độ ghi nhớ</h3>
        <div class="dist">${dist.map(([l, v, col]) => `<i style="width:${v / tot * 100}%;background:${col}" title="${l}: ${v}"></i>`).join('')}</div>
        <div class="legend">${dist.map(([l, v, col]) => `<span style="--c:${col}">${l}: <b>${v}</b></span>`).join('')}</div>

        <div class="row">${['A1', 'A2', 'B1', 'B2', 'C1', 'C2', '?'].filter(k => cefr[k]).map(k => `<span class="chip" style="cursor:default">${k}: ${cefr[k]}</span>`).join('') || '<span class="muted small">Chưa có dữ liệu</span>'}</div>
      </section>

    <section class="card stack"><h3>Từ khó nhớ nhất</h3>${hard.length ? `<div class="word-chips">${hard.map(w => `<button class="wchip" data-open="${w.id}"><b>${esc(w.word)}</b><span>quên ${w.srs.lapses} lần</span></button>`).join('')}</div>` : '<p class="muted">Chưa có từ nào bị quên. Tuyệt!</p>'}</section>
  </div>`;
  main.addEventListener('click', homeClick);

/* ================= helpers shared by study & games ================= */
function shuffleKeepSpaces(word) {
  const chars = word.trim().split(''); const letters = shuffle(chars.filter(c => c !== ' '));
  let i = 0; let out = chars.map(c => c === ' ' ? ' ' : letters[i++]).join('');
  if (out === word && word.replace(/\s/g, '').length > 2) return shuffleKeepSpaces(word);
  return out;
}
function hideHalf(word) {
  const w = word.trim(); const idx = [...w].map((c, i) => /[a-z]/i.test(c) ? i : -1).filter(i => i >= 0);
  const hide = new Set(pick(idx, Math.floor(idx.length / 2)));
  return [...w].map((c, i) => hide.has(i) ? '_' : c).join(' ');
}
function hideEnds(word) { const w = word.trim(); if (w.length <= 2) return '_' + w.slice(1); return ('_' + w.slice(1, -1) + '_').split('').join(' '); }
function distractors(w, n = 3, pool) {
  pool = pool || [...S.words.values()];
  const others0 = pool.filter(x => x.id !== w.id && norm(x.word) !== norm(w.word));
  const sameType = others0.filter(x => typeOf(x) === typeOf(w));
  const others = sameType.length >= n ? sameType : others0;
  const p0 = (w.pos || '').split(' ')[0];
  const same = others.filter(x => (x.pos || '').split(' ')[0] === p0);
  let base = same.length >= n ? same : others;
  if (base.length < n) base = [...S.words.values()].filter(x => x.id !== w.id && norm(x.word) !== norm(w.word));
  const seenVi = new Set([norm(w.vi)]); const out = [];
  for (const x of shuffle(base)) { if (seenVi.has(norm(x.vi))) continue; seenVi.add(norm(x.vi)); out.push(x); if (out.length === n) break; }
  return out;
}
const shortVi = w => String(w.vi || '').split(';')[0].trim();
function prefixLen(a, b) { a = a.toLowerCase(); b = b.toLowerCase(); let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return i; }
function liveCheck(input, word) {
  const v = input.value; input.classList.remove('good', 'bad');
  if (!v) return;
  if (norm(v) === norm(word)) input.classList.add('good');
  else if (!word.toLowerCase().startsWith(v.toLowerCase())) input.classList.add('bad');
}
function hintLetter(input, word) {
  const k = prefixLen(word, input.value); input.value = word.slice(0, Math.min(word.length, k + 1)); liveCheck(input, word); input.focus();
}
/* shift tapped alone = hint (like the user's Anki template) */
function shiftTapWatcher(onTap) {
  let down = false, other = false;
  const kd = e => { if (e.key === 'Shift') { down = true; other = false; } else if (down) other = true; };
  const ku = e => { if (e.key === 'Shift') { if (down && !other) onTap(); down = false; } };
  document.addEventListener('keydown', kd); document.addEventListener('keyup', ku);
  S.cleanup.push(() => { document.removeEventListener('keydown', kd); document.removeEventListener('keyup', ku); });
}
function hintBlock(w) {
  const types = [1]; if ((w.suggest || []).length) types.push(2); if ((w.synonyms || []).length) types.push(3);
  const t = types[Math.random() * types.length | 0];
  if (t === 2) return `<div class="hintbox"><span class="lbl">Gợi ý</span>${w.suggest.map(s => `<div>• ${esc(s)}</div>`).join('')}<div class="guess">${esc(hideHalf(w.word))}</div></div>`;
  if (t === 3) return `<div class="hintbox"><span class="lbl">Đồng nghĩa</span><div class="syn-chips">${w.synonyms.map(s => `<span>${esc(s)}</span>`).join('')}</div><div class="guess">${esc(hideEnds(w.word))}</div></div>`;
  return `<div class="hintbox" style="align-items:center"><span class="lbl">Sắp xếp lại chữ cái</span><div class="guess">${esc(shuffleKeepSpaces(w.word))}</div></div>`;
}
function clozeHtml(w) {

  if (!parts) return '';
  return `<div class="cloze">${esc(parts[0])}<span class="blank"></span>${esc(parts[2])}</div>`;
}

/* ================= STUDY (spaced repetition) ================= */
let SESS = null;
let STUDY_PRESET = null;
function sessBase(extra) { return { main: [], learn: new Set(), done: 0, ok: 0, coins: 0, start: now(), history: [], lastId: null, forceNext: null, requeue: {}, ...extra }; }
function buildPractice(ws, label) { return sessBase({ main: ws.map(w => ({ id: w.id })), practice: true, label }); }
function buildAhead(days) {
  const lim = now() + days * DAY;
  const ws = wordsInDeck().filter(w => w.srs?.state === 2 && w.srs.due <= lim).sort((a, b) => a.srs.due - b.srs.due);
  return sessBase({ main: ws.map(w => ({ id: w.id })), label: 'Ôn trước ' + days + ' ngày' });
}
function buildSession(extraNew = 0) {
  const all = wordsInDeck().filter(w => !buriedToday(w));
  const revLeft = Math.max(0, (S.profile.settings.maxRev || 200) - ((S.log.days[dayKey()]?.r) || 0));
  const due = all.filter(w => w.srs?.state === 2 && w.srs.due <= endOfToday()).sort((a, b) => a.srs.due - b.srs.due).slice(0, revLeft);
  const learn = all.filter(w => w.srs && (w.srs.state === 1 || w.srs.state === 3));
  let nwAll = all.filter(w => !w.srs || !w.srs.state);
  nwAll = S.profile.settings.newOrder === 'random' ? shuffle(nwAll) : nwAll.sort((a, b) => a.created - b.created);
  // avoid introducing near-synonyms or same-meaning items on the same day (interference research)
  const today = dayKey(); const intro = [...S.words.values()].filter(w => w.introDay === today);
  const clash = (a, b) => norm(a.word) === norm(b.word) || (a.synonyms || []).some(x => norm(x) === norm(b.word)) || (b.synonyms || []).some(x => norm(x) === norm(a.word)) || (shortVi(a) && norm(shortVi(a)) === norm(shortVi(b)));
  const limit = newLeft() + extraNew; const nw = [];
  for (const w of nwAll) { if (nw.length >= limit) break; if ([...nw, ...intro].some(x => clash(x, w))) continue; nw.push(w); }
  if (nw.length < limit) for (const w of nwAll) { if (nw.length >= Math.min(limit, nwAll.length) || extraNew === 0) break; if (!nw.includes(w)) nw.push(w); }
  const main = []; let i = 0, j = 0;
  while (i < due.length || j < nw.length) {
    for (let k = 0; k < 4 && i < due.length; k++) main.push({ id: due[i++].id });
    if (j < nw.length) main.push({ id: nw[j++].id, intro: true });
  }
  return sessBase({ main, learn: new Set(learn.map(w => w.id)) });
}
function viewStudy(main) {
  SESS = STUDY_PRESET ? STUDY_PRESET() : buildSession(); STUDY_PRESET = null;
  main.innerHTML = `<div class="page narrow" id="study"></div>`;
  nextStudy();
}
function pickNext() {
  if (SESS.forceNext) { const id = SESS.forceNext; SESS.forceNext = null; const i = SESS.main.findIndex(x => x.id === id); return i >= 0 ? SESS.main.splice(i, 1)[0] : { id }; }
  const t = now();
  const lw = [...SESS.learn].map(id => S.words.get(id)).filter(Boolean).sort((a, b) => a.srs.due - b.srs.due);
  const ready = lw.find(w => w.srs.due <= t && w.id !== SESS.lastId);
  if (ready) return { id: ready.id };
  if (SESS.main.length) return SESS.main.shift();
  if (lw.length) { const w = lw.find(x => x.id !== SESS.lastId) || lw[0]; return { id: w.id }; }
  return null;
}
function studyTop() {
  const nNew = SESS.main.filter(x => x.intro).length, nDue = SESS.main.filter(x => !x.intro).length, nL = SESS.learn.size;
  const total = SESS.done + nNew + nDue + nL; const pct = total ? SESS.done / total * 100 : 100;
  return `<div class="row between small" style="margin-bottom:8px"><span class="muted">${SESS.practice ? '<span class="pill learn">Luyện tập</span> ' + esc(SESS.label) + ' · không đổi lịch ôn' : 'Đang ôn: <b>' + esc(scopeLabel()) + '</b>' + (SESS.label ? ' · ' + esc(SESS.label) : '')}</span><button class="btn sm ghost" id="custom">Ôn tuỳ chọn</button></div>
  <div class="study-top">
    <a class="icon-btn" href="#home" aria-label="Thoát" title="Thoát">✕</a>

/* ---- collocation game ---- */
const PREPS = ['in', 'on', 'at', 'for', 'with', 'to', 'of', 'by', 'from', 'about', 'into', 'over', 'under', 'up', 'out', 'off'];

    if (!cs.length) continue;
    const pref = cs.filter(x => x.c.diff); const { c, tg } = (pref.length ? pref : cs)[Math.random() * (pref.length || cs.length) | 0];
    qs.push({ w, c, tg });
  }
  const allAns = qs.map(q => q.tg.answer.toLowerCase());
  for (const q of qs) {
    const a = q.tg.answer.toLowerCase();
    let pool = PREPS.includes(a) ? PREPS : COMMON_V.includes(a) ? COMMON_V : [...allAns, ...COMMON_V];

}

      res.querySelector('.fb').textContent = r.feedback || ''; res.querySelector('.cor').textContent = r.corrected || text;
      $$('.inbox-item .ctx', res).forEach((el, i) => el.textContent = ws[i]._c);

      ta.disabled = true; b.remove(); G.i = ws.length;

  };
  $('#e-go', body).onclick = go;

      <textarea id="dd-words" rows="3" placeholder="${TYPE_HELP[DD_TYPE].ph}"></textarea>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-act="inbox">Lưu vào hộp chờ</button><button class="btn" data-act="manual">Thêm thủ công</button><button class="btn primary" data-act="gen" ${aiOn() ? '' : 'disabled'}>✨ Tạo thẻ bằng AI</button></div>
      <div id="sug-out"></div>
      <div class="gen-list" id="gen-list"></div></section>
    ${aiOn() && ws.length && (noImg || noMem || old) ? `<section class="card stack"><div class="row between"><div><b>Công cụ ghi nhớ cho cả bộ</b><p class="small muted">Mỗi từ có thêm hình và mẹo nhớ sẽ dễ nhớ hơn. AI làm lần lượt từng từ, bạn có thể dừng bất cứ lúc nào.</p></div><div class="row">${old ? `<button class="btn sm" data-act="bulkup" title="Thêm nghĩa cốt lõi, các nghĩa, collocation theo mẫu, lỗi người Việt hay mắc… mà vẫn giữ nguyên tiến độ">⬆ Nâng cấp ${old} thẻ cũ theo mẫu mới</button>` : ''}${noImg ? `<button class="btn sm" data-act="bulkimg">🖼 Vẽ hình cho ${noImg} từ chưa có ảnh</button>` : ''}${noMem ? `<button class="btn sm" data-act="bulkmem">💡 Thêm mẹo nhớ cho ${noMem} từ</button>` : ''}</div></div><div id="bulk-prog" class="small muted"></div></section>` : ''}
    <section class="stack"><h3>Từ trong bộ</h3><div id="dd-wb"></div></section>

  mountWordBrowser($('#dd-wb', main), sc);

    if (e.target.closest('#dd-type')) { const b = e.target.closest('[data-type]'); if (b) { DD_TYPE = b.dataset.type; $$('#dd-type [data-type]', main).forEach(x => x.classList.toggle('on', x === b)); $('#dd-words', main).placeholder = TYPE_HELP[DD_TYPE].ph.replace(/&#10;/g, '\n'); } return; }

    if (act === 'inbox') { const items = parseInputList(ta.value, DD_TYPE === 'word'); if (!items.length) return toast('Hãy nhập ít nhất một từ.', 'err'); items.forEach(it => S.profile.inbox.push({ id: rid('i'), ...it, type: DD_TYPE, t: now() })); saveProfile(); ta.value = ''; toast('Đã lưu ' + items.length + ' từ vào hộp chờ.', 'ok'); }

      const prog = $('#bulk-prog', main);

      let done = 0, fail = 0;
      for (const w of todo) {
        if (stopBulk || !document.body.contains(b)) break;
        prog.innerHTML = `<span class="spin"></span> ${act === 'bulkimg' ? 'Đang vẽ' : act === 'bulkup' ? 'Đang nâng cấp' : 'Đang nghĩ mẹo cho'} “${esc(w.word)}” (${done + 1}/${todo.length})`;

          else { const r = await aiMemory(w); w.memory = { ...(w.memory || {}), ...r }; if (!w.mnemonic) w.mnemonic = r.sound || ''; }
          persistWord(w); done++;
        } catch (err) { fail++; if (err && (err.code === 'rate_limited' || err.code === 'not_granted')) break; }
      }
      if (document.body.contains(prog)) prog.textContent = `Xong ${done} từ${fail ? `, ${fail} từ chưa làm được` : ''}.`;
      delete b.dataset.running; b.textContent = orig;
    }
  });
}
async function suggestForDeck(d, out, genList, type = 'word') {
  const topic = d.name + (d.desc ? ' – ' + d.desc : '');
  out.innerHTML = '<p class="muted small"><span class="spin"></span> AI đang tìm từ cho chủ đề này…</p>';
  try {
    const have = [...S.words.values()].map(w => w.word);
    const list = await aiTopic(topic, 'B1–B2', type === 'grammar' ? 8 : 15, have, type);
    renderSuggestList(out, list, items => generateList(items, d.id, genList, null, type));
  } catch { out.innerHTML = '<p class="muted small">Chưa gợi ý được, thử lại sau nhé.</p>'; }
}
function renderSuggestList(out, list, onCreate) {
  if (!list.length) { out.innerHTML = '<p class="muted small">Không tìm thấy từ phù hợp.</p>'; return; }
  out.innerHTML = `<div class="stack" style="gap:8px">
    <div class="row between"><label class="row small"><input type="checkbox" class="sg-all" checked> Chọn tất cả</label><button class="btn primary sm sg-go">✨ Tạo thẻ cho từ đã chọn</button></div>
    ${list.map((x, i) => { const has = findByWord(x.word); return `<label class="inbox-item"><input type="checkbox" class="sg" value="${i}" ${has ? '' : 'checked'}><div style="flex:1;min-width:0"><b style="font-family:var(--font-word);font-size:17px">${esc(x.word)}</b> <span class="muted">${esc(x.vi || '')}</span>${has ? ' <span class="pill young">đã có</span>' : ''}${x.why ? `<div class="ctx">${esc(x.why)}</div>` : ''}</div></label>`; }).join('')}</div>`;
  $('.sg-all', out).onchange = e => $$('.sg', out).forEach(c => c.checked = e.target.checked);
  $('.sg-go', out).onclick = () => { const items = $$('.sg', out).filter(c => c.checked).map(c => ({ word: list[+c.value].word, context: '' })); if (!items.length) return; out.innerHTML = ''; onCreate(items); };
}
