function openTopicDeck(opts = {}) {
  const fsel = opts.folder || '';
  const m = openModal(`<div class="modal-head"><h3>✨ Tạo bộ từ theo chủ đề</h3><button class="icon-btn" data-x aria-label="Đóng">✕</button></div>
    <div class="stack" style="gap:8px"><span class="small muted">Chọn nhanh</span><div class="row">${TOPIC_PRESETS.map((p, i) => `<button type="button" class="chip" data-pre="${i}">${p.icon} ${esc(p.name)}</button>`).join('')}</div></div>
    <form id="td" class="stack">
      <div class="row between"><span class="small muted">Loại thẻ</span>${typeTabs('td-type', 'word')}</div>
      <label class="field">Chủ đề (càng cụ thể càng tốt, có thể dán tiêu đề bài báo)<input type="text" id="td-topic" placeholder="Ví dụ: TOEIC Part 1 – mô tả tranh trong kho hàng; Bài báo về rác thải nhựa" required autofocus></label>
      <div class="grid2">
        <label class="field">Trình độ<select id="td-level"><option>A2</option><option selected>B1–B2</option><option>B2–C1</option><option>TOEIC 450–650</option><option>TOEIC 650–850</option><option>TOEIC 850+</option><option>IELTS 5.5–6.5</option><option>IELTS 7.0+</option></select></label>
        <label class="field">Số từ<select id="td-n"><option>10</option><option selected>15</option><option>20</option><option>30</option></select></label>
        <label class="field">Tên bộ<input type="text" id="td-name" placeholder="Tự đặt theo chủ đề"></label>
        <label class="field">Biểu tượng<input type="text" id="td-icon" value="🎯"></label>
        <label class="field">Folder<select id="td-folder"><option value="">(Không thuộc folder nào)</option>${S.profile.folders.map(f => `<option value="${esc(f.id)}" ${f.id === fsel ? 'selected' : ''}>📁 ${esc(f.name)}</option>`).join('')}</select></label>
        <label class="field">…hoặc folder mới<input type="text" id="td-newf" placeholder="Ví dụ: TOEIC"></label>
      </div>
      <div class="row" style="justify-content:flex-end"><button class="btn primary" id="td-go">Gợi ý danh sách từ</button></div>
    </form>
    <div id="td-out"></div>`);
  m.addEventListener('click', e => {
    if (e.target.closest('[data-x]')) { closeModal(); return; }
    const tb = e.target.closest('#td-type [data-type]'); if (tb) { $$('#td-type [data-type]', m).forEach(x => x.classList.toggle('on', x === tb)); return; }
    const pr = e.target.closest('[data-pre]'); if (!pr) return;
    const p = TOPIC_PRESETS[+pr.dataset.pre];
    $$('#td-type [data-type]', m).forEach(x => x.classList.toggle('on', x.dataset.type === (p.type || 'word')));
    $('#td-topic', m).value = p.topic; $('#td-name', m).value = p.name; $('#td-icon', m).value = p.icon;
    const ex = S.profile.folders.find(f => f.name.toLowerCase() === p.folder.toLowerCase());
    if (ex) { $('#td-folder', m).value = ex.id; $('#td-newf', m).value = ''; } else { $('#td-folder', m).value = ''; $('#td-newf', m).value = p.folder; }
    if (p.folder.startsWith('TOEIC')) $('#td-level', m).value = 'TOEIC 650–850';
    if (p.folder.startsWith('IELTS')) $('#td-level', m).value = 'IELTS 5.5–6.5';
  });

    const out = $('#td-out', m);
    try {
      const ttype = $('#td-type .on', m)?.dataset.type || 'word';
      const list = await aiTopic(topic, $('#td-level', m).value, ttype === 'grammar' ? Math.min(10, +$('#td-n', m).value) : +$('#td-n', m).value, [...S.words.values()].map(w => w.word), ttype);
      renderSuggestList(out, list, items => {
        let folder = $('#td-folder', m).value; const nf = $('#td-newf', m).value.trim();
        if (nf) folder = (S.profile.folders.find(x => x.name.toLowerCase() === nf.toLowerCase()) || createFolder({ name: nf })).id;

        setTimeout(() => { const gl = $('#gen-list'); if (gl) generateList(items, deck.id, gl, () => { if (S.route === 'decks' && DK.open === deck.id) render(); }, ttype); }, 60);
      });
      const go = out.querySelector('.sg-go'); if (go) go.textContent = '✨ Tạo bộ & tạo thẻ';
    } catch { out.innerHTML = '<p class="muted small">Chưa gợi ý được, thử lại nhé.</p>'; }
    btn.disabled = false; btn.textContent = 'Gợi ý lại';
  });
}

  const out = { id: n.id || rid('n'), t }; if (kids.length) out.c = kids; if (n.ref) out.ref = n.ref; if (n.collapsed) out.collapsed = true;
  return out;
}
function ensureGrammarFolder() {

function createGrammarTopic(res, { cardIdx, vocabIdx, withOverview = true }) {
  const f = ensureGrammarFolder();
  const deck = createDeck({ name: res.topic + (res.topic_vi ? ' · ' + res.topic_vi : ''), folder: f.id, icon: res.overview?.emoji?.slice(0, 2) || '🧩', desc: res.summary || '' });
  deck.kind = 'grammar'; deck.level = res.level || '';
  deck.mindmap = normMap(res.mindmap) || null; saveProfile();
  let n = 0; const t0 = now();
  if (withOverview && res.overview) { const w = makeWord({ ...res.overview, type: 'grammar', word: res.overview.word || res.topic, pos: 'ngữ pháp · tổng quan', cefr: res.level, v: 2 }, deck.id); w.created = t0 + n++; persistWord(w); }
  res.cards.forEach((c, i) => {
    if (cardIdx && !cardIdx.has(i)) return;
    const w = makeWord({ type: 'gcard', word: S_(c.q), vi: S_(c.a), gkind: c.gkind, explain: S_(c.explain), examples: c.examples, exercises: c.exercises, topic: res.topic, cefr: res.level, v: 2, emoji: GK[c.gkind].ic }, deck.id);

  });
  addLog('a', n);
  return { deck, vocab: res.vocab.filter((v, i) => !vocabIdx || vocabIdx.has(i)) };
}

const MM_COLORS = ['#58cc02', '#4cc3ff', '#ffb020', '#ff7a6b', '#b07cff', '#3fd17a', '#ff6fae', '#22c3b5'];
const MM_FONT = d => d === 0 ? "800 18px 'Be Vietnam Pro', system-ui, sans-serif" : d === 1 ? "700 15px 'Be Vietnam Pro', system-ui, sans-serif" : "500 14px 'Be Vietnam Pro', system-ui, sans-serif";
const MM_HGAP = 46, MM_VGAP = 12;
let MM = null;
let _mmctx = null;
function mmTextW(t, font) { _mmctx = _mmctx || document.createElement('canvas').getContext('2d'); _mmctx.font = font; return _mmctx.measureText(t).width; }
function mmWrap(text, maxW, font) {
  const words = String(text).split(/\s+/); const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (mmTextW(t, font) > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  if (lines.length > 4) { lines.length = 4; lines[3] = lines[3].replace(/.{0,2}$/, '…'); }
  return lines;
}
function mmIds(n) { if (!n.id) n.id = rid('n'); (n.c || []).forEach(mmIds); return n; }
function mmFind(n, id, parent = null) { if (n.id === id) return { node: n, parent }; for (const k of n.c || []) { const r = mmFind(k, id, n); if (r) return r; } return null; }
function mmDepth(n) { return 1 + Math.max(0, ...(n.c || []).map(mmDepth)); }
function mmCount(n, minDepth, d = 0) { return (d >= minDepth ? 1 : 0) + (n.c || []).reduce((a, k) => a + mmCount(k, minDepth, d + 1), 0); }
function mmClean(n) { const o = { id: n.id, t: n.t }; if (n.ref) o.ref = n.ref; if (n.collapsed) o.collapsed = true; if ((n.c || []).length) o.c = n.c.map(mmClean); return o; }

async function aiGroupDeck(d) {
  const ws = wordsInDeck('d:' + d.id, true).filter(isLexical).slice(0, 150);
  const prompt = `Group these English vocabulary items (from a learner's deck named "${d.name}") into 3-8 meaningful sub-topics or situations that help memory (by scene, function or theme, NOT by part of speech). Every item must appear exactly once; use the item text exactly as given.
Items: ${ws.map(w => w.word).join(' | ')}
Return ONLY JSON: {"groups": [{"name": "short Vietnamese sub-topic name", "words": ["item", ...]}]}`;
  const res = await askAI(prompt, { tier: 'quick' }); const j = parseJSON(res.text);
  const used = new Set();
  const kids = (j.groups || []).map(g => ({ id: rid('n'), t: S_(g.name), c: (g.words || []).map(x => ws.find(w => norm(w.word) === norm(x))).filter(w => w && !used.has(w.id) && used.add(w.id)).map(w => ({ id: rid('n'), t: w.word + (shortVi(w) ? ' – ' + shortVi(w) : ''), ref: w.id })) })).filter(g => g.t && g.c.length);
  const rest = ws.filter(w => !used.has(w.id)); if (rest.length) kids.push({ id: rid('n'), t: 'Khác', c: rest.map(w => ({ id: rid('n'), t: w.word, ref: w.id })) });
  return { id: rid('n'), t: d.name, c: kids };
}
function folderMap(f) {
  const ds = S.profile.decks.filter(d => d.folder === f.id);
  return { t: f.name, c: ds.map(d => { const m = d.mindmap || autoDeckMap(d); return { t: d.name, collapsed: true, c: (m.c || []).map(k => ({ ...k, collapsed: true })) }; }) };
}
function allGrammarMap() {

let HKD = null;
const HK = { day: null };

const HK_PASS = 70;
function hkData() {
  if (HKD) return HKD;
  try { HKD = JSON.parse(document.getElementById('hk-json').textContent); } catch { HKD = { days: [] }; }
  HKD.days.forEach(d => {
    d.H = d.h.map((x, i) => ({ id: `hk${d.n}h${i}`, word: x[0], pos: x[1], vi: x[2], lv: 'h', sec: '', day: d.n }));
    d.L = d.l.map((x, i) => ({ id: `hk${d.n}l${i}`, word: x[0], pos: x[1], vi: x[2], lv: String(x[3]), sec: x[4] || '', day: d.n }));
    d.all = [...d.H, ...d.L];
  });
  HKD.byId = new Map(HKD.days.flatMap(d => d.all.map(e => [e.id, e])));
  return HKD;
}
const hkDayData = n => hkData().days[n - 1];
function hkState() {
  const p = S.profile;
  if (!p.hk || typeof p.hk !== 'object') p.hk = {};
  const st = p.hk; st.days = st.days || {}; st.decks = st.decks || {}; st.ai = st.ai || {}; st.miss = st.miss || {};
  return st;
}
const hkDay = n => { const st = hkState(); return st.days[n] || (st.days[n] = {}); };
const hkPad = n => String(n).padStart(2, '0');
function hkCards() { const m = new Map(); for (const w of S.words.values()) if (w.hk) m.set(w.hk, w); return m; }
function hkPassed(n) { return (hkDay(n).test || 0) >= HK_PASS; }
function hkOpen(n) { if (n <= 1 || hkState().unlockAll) return true; return hkPassed(n - 1); }
function hkStars(pct) { return pct >= 90 ? 3 : pct >= 80 ? 2 : pct >= HK_PASS ? 1 : 0; }
const hkStarStr = k => '★'.repeat(k) + '☆'.repeat(3 - k);
const hkStarHtml = k => `<span class="hk-stars" aria-label="${k}/3 sao">${'★'.repeat(k)}<i>${'★'.repeat(3 - k)}</i></span>`;
function hkCkOpen(k) { if (hkState().unlockAll) return true; for (let n = k * 10 - 9; n <= k * 10; n++) if (!hkPassed(n)) return false; return true; }
function hkLearnPct(n, cards = hkCards()) {
  const d = hkDayData(n); if (!d) return 0;
  const got = d.H.filter(e => { const w = cards.get(e.id); return w && w.srs?.state; }).length;
  return Math.round(got / d.H.length * 100);
}
function hkProgress(n, cards = hkCards()) {
  const ds = hkDay(n);
  const ext = ['b', 8, 9].reduce((a, k) => a + (((ds.ext || {})[k] || 0) >= HK_PASS ? 1 : 0), 0) / 3;
  const parts = [Math.min(1, hkLearnPct(n, cards) / 80), (ds.prac || 0) >= HK_PASS ? 1 : 0, (ds.check || 0) >= HK_PASS ? 1 : 0, ext, hkPassed(n) ? 1 : 0];
  return Math.round(parts.reduce((a, b) => a + b, 0) / parts.length * 100);
}
function hkCurrentDay() { for (let n = 1; n <= 30; n++) if (!hkPassed(n)) return n; return 30; }
function hkFolder() {
  const st = hkState();
  let f = st.folder && folderById(st.folder);
  if (!f) { f = S.profile.folders.find(x => x.kind === 'hackers'); }
  if (!f) { f = { id: rid('f'), name: 'Hackers TOEIC Vocabulary', icon: '🏆', color: '', created: now(), kind: 'hackers' }; S.profile.folders.push(f); }
  st.folder = f.id; return f;
}
function hkDeck(n) {
  const st = hkState(); const d = hkDayData(n);
  let dk = st.decks[n] && deckById(st.decks[n]);
  if (!dk) dk = S.profile.decks.find(x => x.hk === n);
  if (!dk) { dk = { id: rid('d'), name: `Day ${hkPad(n)} · ${d.topic}`, folder: hkFolder().id, icon: '🏆', desc: `Hackers TOEIC Vocabulary · ${d.t}`, created: now() + n, hk: n }; S.profile.decks.push(dk); }
  st.decks[n] = dk.id; return dk;
}
function hkAddCards(n, entries) {
  const dk = hkDeck(n); const cards = hkCards(); let made = 0; const t0 = now();
  entries.forEach((e, i) => {
    if (cards.has(e.id)) return;
    const w = makeWord({ word: e.word, pos: e.pos, vi: e.vi, type: /\s/.test(e.word.trim()) ? 'phrase' : 'word' }, dk.id);
    w.hk = e.id; w.hkLv = e.lv; w.created = t0 + i; w.note = `Hackers TOEIC · Day ${hkPad(n)} · ${HK_LV[e.lv]}${e.sec ? ' · ' + e.sec : ''}`;
    persistWord(w); made++;
  });
  if (made) { addLog('a', made); saveProfile(); }
  return made;
}
function hkSearch(q) {
  q = norm(q); if (q.length < 2) return [];
  const out = [];
  for (const d of hkData().days) for (const e of d.all) {
    if (norm(e.word).includes(q) || norm(e.vi).includes(q)) { out.push(e); if (out.length >= 30) return out; }
  }
  return out.sort((a, b) => (norm(a.word).startsWith(q) ? 0 : 1) - (norm(b.word).startsWith(q) ? 0 : 1));
}

function makeDictation() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return null;
  let rec = null; const L = { p: [], f: [], s: [] };
  return {
    onPartial(cb) { L.p.push(cb); }, onFinal(cb) { L.f.push(cb); }, onState(cb) { L.s.push(cb); },
    start() {
      return new Promise((res, rej) => {
        try {
          rec = new SR(); rec.lang = S.profile.settings.accent === 'us' ? 'en-US' : 'en-GB'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 3;
          rec.onstart = () => { L.s.forEach(f => f({ state: 'listening' })); res(); };
          rec.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; const t = [...r].map(a => a.transcript).join(' '); (r.isFinal ? L.f : L.p).forEach(f => f({ text: r.isFinal ? t : r[0].transcript })); } };
          rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') rej({ code: 'not_granted' }); };
          rec.onend = () => L.s.forEach(f => f({ state: 'idle', reason: 'stopped' }));
          rec.start();
        } catch (err) { rej(err); }
      });
    },
    stop() { try { rec && rec.stop(); } catch { } return Promise.resolve(); }
  };
}
/* ---- sync between devices through a secret GitHub Gist ---- */
const SYNC_FILE = 'sotuvung-data.json';
const Sync = {
  busy: false, timer: null, lastErr: '',
  cfg() { return LS.get('sotuvung:sync', { token: '', gistId: '', last: 0, auto: true }); },
  save(c) { LS.set('sotuvung:sync', c); },
  on() { return !!this.cfg().token; },
  async api(path, opts = {}) {
    const c = this.cfg();
    const r = await fetch('https://api.github.com' + path, { ...opts, headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + c.token, 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
    if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch { } throw { status: r.status, message: m || ('HTTP ' + r.status) }; }
    return r.status === 204 ? null : r.json();
  },
  async findGist() {
    for (let page = 1; page <= 10; page++) {
      const list = await this.api(`/gists?per_page=100&page=${page}`);
      const g = list.find(x => x.files && x.files[SYNC_FILE]); if (g) return g.id;
      if (list.length < 100) break;
    }
    return '';
  },
  async pull(id) {
    const g = await this.api('/gists/' + id); const f = g.files && g.files[SYNC_FILE]; if (!f) return null;
    let text = f.content;
    if (f.truncated || !text) { const r = await fetch(f.raw_url, { cache: 'no-store' }); text = await r.text(); }
    return JSON.parse(text);
  },
  async push(id, data) { return this.api('/gists/' + id, { method: 'PATCH', body: JSON.stringify({ files: { [SYNC_FILE]: { content: JSON.stringify(data) } } }) }); },
  async create(data) { const g = await this.api('/gists', { method: 'POST', body: JSON.stringify({ description: 'Sổ Từ Vựng – dữ liệu đồng bộ (đừng xoá)', public: false, files: { [SYNC_FILE]: { content: JSON.stringify(data) } } }) }); return g.id; },
  soon() { if (!this.on() || !this.cfg().auto) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 12000); this.status('pending'); },
  async run(manual = false) {
    if (!this.on()) return false;
    if (this.busy) { if (manual) toast('Đang đồng bộ, đợi chút nhé.'); return false; }
    this.busy = true; clearTimeout(this.timer); this.status('syncing');
    try {
      const c = this.cfg();
      let id = c.gistId;
      if (!id) { id = await this.findGist(); c.gistId = id; this.save(c); }
      const local = exportData();
      if (!id) { id = await this.create(local); c.gistId = id; }
      else {
        let remote = null;
        try { remote = await this.pull(id); } catch (e) { if (e.status === 404) { id = await this.create(local); c.gistId = id; } else throw e; }
        if (remote) {
          const merged = mergeData(local, remote);
          if (signature(merged) !== signature(local)) applyMerged(merged);
          if (signature(merged) !== signature(remote)) await this.push(id, { app: 'sotuvung', version: 2, exported: new Date().toISOString(), ...clone(merged) });
        }
      }
      c.last = now(); this.save(c); this.lastErr = ''; this.status('ok');
      if (manual) toast('Đã đồng bộ xong.', 'ok');
      return true;
    } catch (e) {
      this.lastErr = e.status === 401 ? 'Token không hợp lệ hoặc đã hết hạn.' : e.status === 403 || e.status === 404 ? 'Token chưa có quyền Gists (đọc và ghi).' : (e.message || 'Không kết nối được GitHub.');
      this.status('err'); if (manual) toast('Đồng bộ lỗi: ' + this.lastErr, 'err');
      return false;
    } finally { this.busy = false; }
  },
  status(st) {
    const el = $('#sync-state'); if (!el) return;
    const c = this.cfg(); el.className = 'sync';
    if (!c.token) { el.classList.add('local'); el.textContent = 'Lưu trên thiết bị này'; return; }
    if (st === 'syncing') { el.textContent = 'Đang đồng bộ…'; return; }
    if (st === 'err') { el.classList.add('local'); el.textContent = 'Đồng bộ lỗi, bấm để thử lại'; return; }
    if (st === 'pending') { el.textContent = 'Có thay đổi, sắp đồng bộ…'; return; }
    el.classList.add('ok'); el.textContent = 'Đã đồng bộ ' + (c.last ? new Date(c.last).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : '');
  },
  init() {
    this.status();
    $('#sync-state')?.addEventListener('click', () => this.run(true));
    if (!this.on()) return;
    this.run();
    document.addEventListener('visibilitychange', () => { if (!this.on()) return; if (document.visibilityState === 'visible') { if (now() - (this.cfg().last || 0) > 60000) this.run(); } else if (this.timer) this.run(); });
    setInterval(() => { if (document.visibilityState === 'visible' && this.on()) this.run(); }, 5 * 60000);
  }
};
/* ---- settings sections ---- */
function standalonePrefsHtml() {
  const a = AICFG(); const c = Sync.cfg();
  return `<section class="card stack" id="sp-sync"><h3>Đồng bộ giữa các thiết bị</h3>
      <p class="small muted">Dữ liệu lưu trên từng thiết bị. Để điện thoại, iPad và máy tính dùng chung, app cất một bản dữ liệu vào một <b>secret Gist</b> trên tài khoản GitHub miễn phí của bạn. Mỗi thiết bị chỉ cần dán cùng một token một lần.</p>
      <details ${c.token ? '' : 'open'}><summary class="small" style="cursor:pointer;font-weight:700">Cách lấy token (làm 1 lần, khoảng 2 phút)</summary>
        <ol class="small steps-ol"><li>Đăng nhập <a href="https://github.com/signup" target="_blank" rel="noopener">GitHub</a> (tạo tài khoản miễn phí nếu chưa có).</li>
        <li>Mở <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">tạo Fine-grained token</a>. Đặt tên “Sổ Từ Vựng”, chọn Expiration dài nhất bạn muốn.</li>
        <li>Ở <b>Permissions → Account permissions</b>, tìm <b>Gists</b> và chọn <b>Read and write</b>. Không cần quyền nào khác.</li>
        <li>Bấm <b>Generate token</b>, sao chép chuỗi bắt đầu bằng <code>github_pat_</code> và dán vào ô dưới. Làm lại bước dán này trên từng thiết bị.</li></ol></details>
      <div class="row"><input type="text" id="sp-token" placeholder="github_pat_…" value="${c.token ? '••••••••' + esc(c.token.slice(-4)) : ''}" style="flex:1;min-width:220px" autocomplete="off"><button class="btn primary" id="sp-connect">${c.token ? 'Đổi token' : 'Kết nối'}</button></div>
      ${c.token ? `<div class="row"><button class="btn sm" id="sp-now">⟳ Đồng bộ ngay</button><label class="row small"><input type="checkbox" id="sp-auto" ${c.auto ? 'checked' : ''}> Tự đồng bộ</label><button class="btn sm danger" id="sp-off">Ngắt kết nối thiết bị này</button></div>
      <p class="small muted">Lần cuối: ${c.last ? new Date(c.last).toLocaleString('vi-VN') : 'chưa'}${Sync.lastErr ? ` · <span style="color:var(--danger)">${esc(Sync.lastErr)}</span>` : ''}${c.gistId ? ` · <a href="https://gist.github.com/${esc(c.gistId)}" target="_blank" rel="noopener">xem Gist</a>` : ''}</p>` : ''}
      <p class="small muted">Lưu ý: secret Gist không hiện công khai nhưng ai có đường link Gist vẫn xem được, nên đừng chia sẻ link đó. Token chỉ lưu trên thiết bị này.</p>
    </section>
    <section class="card stack" id="sp-ai"><h3>AI tạo thẻ</h3>
      <p class="small muted">Bản độc lập dùng AI bằng key riêng của bạn, lưu trên thiết bị này. Gemini có gói miễn phí giới hạn lượt dùng mỗi ngày, không cần thẻ thanh toán. Nếu không muốn dùng key, nút “Tạo bằng chatbot miễn phí” ở mục Thêm từ vẫn dùng được.</p>
      <div class="grid2">
        <label class="field">Dịch vụ<select id="sp-prov"><option value="none">Không dùng</option><option value="gemini">Google Gemini (có gói miễn phí)</option><option value="anthropic">Claude API (trả phí theo lượt)</option></select></label>
        <label class="field">Model (để trống = tự chọn)<input type="text" id="sp-model" value="${esc(a.model || '')}" placeholder="tự chọn"></label>
        <label class="field" style="grid-column:1/-1">API key<input type="text" id="sp-key" value="${a.key ? '••••••••' + esc(a.key.slice(-4)) : ''}" autocomplete="off" placeholder="Dán key vào đây"></label>
      </div>
      <p class="small muted">Lấy key Gemini: mở <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio → API keys</a>, đăng nhập Google, bấm Create API key. Key Claude lấy ở <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.</p>
      <div class="row"><button class="btn primary" id="sp-ai-save">Lưu & kiểm tra</button><span class="small muted" id="sp-ai-st">${S.caps.sample ? '✓ AI đang bật' : 'AI đang tắt'}</span></div>
    </section>`;
}
function bindStandalonePrefs(main) {
  const a = AICFG(); $('#sp-prov', main).value = a.provider || 'none';
  $('#sp-connect', main).onclick = async () => {
    const v = $('#sp-token', main).value.trim(); if (!v || v.startsWith('••')) { toast('Dán token GitHub vào ô trước.', 'err'); return; }
    const c = Sync.cfg(); c.token = v; c.gistId = ''; c.auto = true; Sync.save(c);
    const b = $('#sp-connect', main); b.disabled = true; b.innerHTML = '<span class="spin"></span> Đang kết nối…';
    const ok = await Sync.run(true);
    if (!ok) { b.disabled = false; b.textContent = 'Kết nối'; }
    else { if (!Sync._inited) { Sync._inited = true; } render(); }
  };
  const now_ = $('#sp-now', main); if (now_) now_.onclick = async () => { await Sync.run(true); render(); };
  const au = $('#sp-auto', main); if (au) au.onchange = e => { const c = Sync.cfg(); c.auto = e.target.checked; Sync.save(c); };
  const off = $('#sp-off', main); if (off) off.onclick = async () => { if (await confirmBox('Ngắt đồng bộ trên thiết bị này? Dữ liệu trên máy vẫn giữ nguyên.', 'Ngắt')) { LS.set('sotuvung:sync', { token: '', gistId: '', last: 0, auto: true }); Sync.status(); render(); } };
  $('#sp-ai-save', main).onclick = async () => {
    const prov = $('#sp-prov', main).value; let key = $('#sp-key', main).value.trim(); let model = $('#sp-model', main).value.trim();
    const old = AICFG(); if (key.startsWith('••')) key = old.key;
    const st = $('#sp-ai-st', main);
    if (prov === 'none' || !key) { LS.set('sotuvung:ai', { provider: 'none', key: '', model: '' }); S.caps.sample = null; st.textContent = 'AI đang tắt'; toast('Đã tắt AI.'); return; }
    st.innerHTML = '<span class="spin"></span> Đang kiểm tra…';
    try {
      if (prov === 'gemini' && !model) { const list = await listGeminiModels(key); model = pickGeminiModel(list); }
      LS.set('sotuvung:ai', { provider: prov, key, model });
      const r = await providerSample('Reply with exactly: OK');
      if (!/ok/i.test(r.text)) throw { message: 'Phản hồi lạ: ' + r.text.slice(0, 60) };
      S.caps.sample = providerSample; st.textContent = '✓ AI đang bật · ' + model; $('#sp-model', main).value = model;
      toast('Đã kết nối AI.', 'ok');
    } catch (e) { S.caps.sample = null; st.textContent = 'Chưa dùng được: ' + (e.message || 'lỗi'); toast('Kiểm tra key chưa đạt: ' + (e.message || ''), 'err'); }
  };
}
async function standaloneBoot() {
  let d = null; try { d = await IDB.get('data'); } catch { }
  const l = cacheLoad('sotuvung:v1:local');
  const stamp = x => !x ? -1 : Math.max(0, ...(x.words || []).map(w => w.upd || w.created || 0), x.profile?.upd || 0, x.log?.upd || 0);
  if (stamp(l) > stamp(d)) d = l;
  applyData(d); applyTheme(); Speech.init();
  S.mode = 'device'; S.cloudLoaded = true;
  const a = AICFG();
  S.caps = { sample: a.key && a.provider !== 'none' ? providerSample : null, tts: null, dictation: makeDictation() };
  render();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch { }
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
  Sync.init();
}

/* ================= router & boot ================= */
const ROUTES = { home: viewHome, study: viewStudy, games: viewGames, add: viewAdd, decks: viewDecks, library: viewLibrary, stats: viewStats, prefs: viewPrefs, method: viewMethod, grammar: viewGrammar, hackers: viewHackers };
function render() {
  S.cleanup.forEach(f => f()); S.cleanup = []; S.onKey = null; S.busy = false; G = null; closeMindMap();
  try { speechSynthesis.cancel(); } catch { }
  const r = (location.hash || '').slice(1); const route = ROUTES[r] ? r : 'home';
  S.route = route;
  $$('[data-nav]').forEach(a => { const on = a.dataset.nav === route; a.classList.toggle('active', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const old = $('#main'); const fresh = old.cloneNode(false); old.replaceWith(fresh);
  ROUTES[route](fresh);
  refreshBadges();
}
window.addEventListener('hashchange', () => { closeModal(); render(); window.scrollTo(0, 0); });
document.addEventListener('keydown', e => {
  if ($('.modal-back') || MM || !S.onKey) return;
  const t = e.target;
  if (t.matches && t.matches('textarea') && !(e.key === 'Enter' && (e.ctrlKey || e.metaKey))) return;
  if (t.matches && t.matches('input, select') && !['Enter', 'Control'].includes(e.key)) return;
  S.onKey(e);
});
async function boot() {
  if (BUILD === 'standalone') { await standaloneBoot(); return; }
  applyData(cacheLoad('sotuvung:v1:local')); applyTheme(); Speech.init(); render();
  const capsP = Promise.all([useCap('sample'), useCap('tts'), useCap('dictation')]).then(([sample, tts, dictation]) => {
    S.caps = { sample, tts, dictation };
    if (S.route === 'add' ? !($('#in-words')?.value) : true) rerenderSoft();
    if (S.route === 'add' && !($('#in-words')?.value) && !S.busy) render();
  });
  await initCloud();
  await capsP;
  refreshBadges();
}
boot();
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-nav="hackers"]'); if (!a) return;
  HK.day = null;
  if (S.route === 'hackers') { e.preventDefault(); stopGame(); render(); window.scrollTo(0, 0); }
});
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-nav="decks"]'); if (!a) return;
  DK.open = null; DK.folder = null;
  if (S.route === 'decks') { e.preventDefault(); render(); }
});
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-nav]'); if (!a || a.dataset.nav === 'decks' || a.dataset.nav === 'hackers') return;
  if (a.dataset.nav === S.route) { e.preventDefault(); closeModal(); stopGame && stopGame(); render(); window.scrollTo(0, 0); }
});
